name: Portable Checks And Cloud Accuracy

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kernel:
        description: Completed trusted Kaggle kernel (purplray/slug); no training is started
        required: true
        type: string
      candidate_run_id:
        description: Exact comparison run or validation-selected study trial directory ID
        required: true
        type: string
      expected_source_sha256:
        description: Expected 64-character bundled source SHA256 from the submitted Kaggle source
        required: true
        type: string
      expected_source_commit:
        description: Expected 40-character source commit; blank requires the workflow commit
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  portable-checks:
    name: Fit-Free Unit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable test dependencies (no torch)
        run: python -m pip install 'pytest>=7.4' 'numpy>=1.24' 'pandas>=2.0' 'scikit-learn>=1.3' 'PyYAML>=6.0' 'nbformat>=5.10'
      # Do not replace this allowlist with all tests or only a marker exclusion:
      # some legacy, unmarked model/comparison/notebook tests fit estimators.
      - name: Run explicit fit-free test files
        run: >-
          python -m pytest -q
          tests/test_accuracy_guard.py
          tests/test_metrics.py
          tests/test_evaluation.py
          tests/test_kaggle_sync.py
          tests/test_analysis.py
          tests/test_study.py

  cloud-accuracy:
    name: Compare Completed Kaggle Candidate
    if: github.event_name == 'workflow_dispatch'
    needs: portable-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transfer dependencies (no torch or training environment)
        run: python -m pip install kaggle 'numpy>=1.24' 'pandas>=2.0'
      - name: Pull trusted completed reports and compare
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_REF: ${{ inputs.kernel }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys
          import tempfile

          from src.utils.accuracy_guard import REPORT_FILES, find_candidate_directory
          from src.utils.kaggle_sync import kernel_status, pull_run

          kernel = os.environ['KERNEL_REF']
          run_id = os.environ['CANDIDATE_RUN_ID']
          commit = os.environ['EXPECTED_SOURCE_COMMIT'] or os.environ['GITHUB_SHA']
          source_hash = os.environ['EXPECTED_SOURCE_SHA256']
          if not re.fullmatch(r'purplray/[A-Za-z0-9][A-Za-z0-9_-]{0,59}', kernel):
              raise SystemExit('Only trusted purplray/slug kernels are accepted')
          if not re.fullmatch(r'[A-Za-z0-9_-]{1,64}', run_id):
              raise SystemExit('Invalid candidate run ID')
          if not re.fullmatch(r'[0-9a-f]{40}', commit) or not re.fullmatch(r'[0-9a-f]{64}', source_hash):
              raise SystemExit('Expected source commit/hash must be full lowercase hexadecimal digests')
          if not os.environ.get('KAGGLE_API_TOKEN'):
              raise SystemExit('KAGGLE_API_TOKEN secret is required')
          status = kernel_status(kernel)
          if not re.search(r'\bcomplete\b', status, re.IGNORECASE):
              raise SystemExit(f'Kaggle kernel is not complete: {status}')

          # Downloaded Python, notebooks and model weights are never executed/loaded.
          # The checkout is always the workflow SHA, not the optional candidate commit.
          destination = Path(os.environ['RUNNER_TEMP']) / 'accuracy-candidate'
          destination.mkdir()
          with tempfile.TemporaryDirectory(prefix='kaggle-reports-') as temporary:
              pulled = pull_run(kernel, Path(temporary), 'download')
              candidate = find_candidate_directory(pulled, run_id)
              for name in REPORT_FILES:
                  shutil.copyfile(candidate / name, destination / name)
          receipt = {
              'kernel': kernel, 'candidate_run_id': run_id,
              'workflow_sha': os.environ['GITHUB_SHA'], 'expected_source_commit': commit,
              'expected_source_sha256': source_hash,
              'files_sha256': {name: hashlib.sha256((destination / name).read_bytes()).hexdigest()
                               for name in REPORT_FILES},
          }
          (destination / 'download_receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          command = [sys.executable, '-m', 'src.utils.accuracy_guard',
                     '--candidate-dir', str(destination), '--tolerance-pp', '0.5',
                     '--expected-source-commit', commit, '--expected-source-sha256', source_hash]
          result = subprocess.run(command, capture_output=True, text=True)
          output = result.stdout + result.stderr
          print(output, end='')
          (destination / 'accuracy_guard.txt').write_text(output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Completed Kaggle Accuracy Check\n\n```text\n' + output + '```\n')
              summary.write('Training stayed on Kaggle. PR unit checks alone do not test newly trained accuracy.\n')
          raise SystemExit(result.returncode)
          PY
      - name: Retain exact candidate reports and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/accuracy-candidate/
          if-no-files-found: warn
          retention-days: 30
